<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Masuk · Video Clipper</title>
<style>
  :root {
    --bg1:#0b0d12; --bg2:#141a2b; --card:rgba(24,27,34,.82); --border:rgba(255,255,255,.08);
    --fg:#eef0f6; --mut:#9aa3b8; --field:#10131a; --field-b:#2a2f3a;
    --acc:#4f8cff; --acc2:#7b61ff; --err:#ff6b6b; --err-bg:rgba(255,107,107,.1);
    --ok:#3ecf8e; --ok-bg:rgba(62,207,142,.1); --shadow:0 24px 60px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg1:#eef2fb; --bg2:#dfe7fa; --card:rgba(255,255,255,.88); --border:rgba(20,30,60,.08);
      --fg:#151a2b; --mut:#5d6783; --field:#fff; --field-b:#ccd4e6;
      --err:#d33a3a; --err-bg:rgba(211,58,58,.08); --ok:#16905c; --ok-bg:rgba(22,144,92,.09);
      --shadow:0 24px 60px rgba(40,60,120,.18);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--fg);
    background:radial-gradient(1000px 600px at 15% 10%, rgba(79,140,255,.22), transparent 60%),
               radial-gradient(900px 600px at 90% 90%, rgba(123,97,255,.20), transparent 60%),
               linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
  }
  .card {
    width:100%; max-width:410px; padding:36px 32px 28px; border-radius:22px;
    background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    animation:rise .45s ease both;
  }
  .brand { display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:26px; }
  .logo {
    width:58px; height:58px; border-radius:17px; display:grid; place-items:center; color:#fff; margin-bottom:16px;
    background:linear-gradient(135deg,var(--acc),var(--acc2)); box-shadow:0 10px 24px rgba(79,140,255,.38);
  }
  .logo svg { width:28px; height:28px; }
  h1 { margin:0 0 6px; font-size:1.45rem; letter-spacing:-.01em; }
  .sub { margin:0; color:var(--mut); font-size:.95rem; }

  .banner {
    display:flex; gap:10px; align-items:flex-start; padding:11px 13px; margin:0 0 18px; border-radius:12px;
    font-size:.9rem; line-height:1.4; border:1px solid transparent;
  }
  .banner svg { flex:none; width:18px; height:18px; margin-top:1px; }
  .banner.err { background:var(--err-bg); border-color:rgba(255,107,107,.35); color:var(--err); }
  .banner.ok  { background:var(--ok-bg);  border-color:rgba(62,207,142,.35);  color:var(--ok); }
  .shake { animation:shake .38s ease; }

  .field { margin-bottom:16px; }
  label.lbl { display:block; font-size:.82rem; font-weight:600; color:var(--mut); margin:0 0 7px; }
  .control { position:relative; }
  .control > svg.lead {
    position:absolute; left:14px; top:50%; width:18px; height:18px; transform:translateY(-50%);
    color:var(--mut); pointer-events:none; transition:color .15s;
  }
  .control input {
    width:100%; height:48px; padding:0 46px 0 44px; border-radius:12px; font-size:1rem; color:var(--fg);
    background:var(--field); border:1px solid var(--field-b); outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .control input::placeholder { color:var(--mut); opacity:.65; }
  .control input:focus { border-color:var(--acc); box-shadow:0 0 0 4px rgba(79,140,255,.18); }
  .control:focus-within > svg.lead { color:var(--acc); }
  .control.invalid input { border-color:var(--err); }
  .eye {
    position:absolute; right:6px; top:50%; transform:translateY(-50%); width:36px; height:36px; display:grid;
    place-items:center; border:0; border-radius:9px; background:transparent; color:var(--mut); cursor:pointer;
  }
  .eye:hover { color:var(--fg); background:rgba(127,127,127,.12); }
  .eye:focus-visible { outline:2px solid var(--acc); }
  .eye svg { width:19px; height:19px; }
  .eye .off { display:none; } .eye[aria-pressed="true"] .on { display:none; } .eye[aria-pressed="true"] .off { display:block; }
  .hint { min-height:1.1em; margin:6px 2px 0; font-size:.8rem; color:#e0a030; display:none; }
  .hint.show { display:block; }

  .row { display:flex; align-items:center; justify-content:space-between; margin:4px 0 20px; }
  .check { display:flex; align-items:center; gap:9px; font-size:.9rem; color:var(--mut); cursor:pointer; user-select:none; }
  .check input { position:absolute; opacity:0; width:0; height:0; }
  .box {
    width:19px; height:19px; border-radius:6px; border:1.5px solid var(--field-b); background:var(--field);
    display:grid; place-items:center; transition:all .15s;
  }
  .box svg { width:12px; height:12px; color:#fff; opacity:0; transform:scale(.6); transition:all .15s; }
  .check input:checked + .box { background:var(--acc); border-color:var(--acc); }
  .check input:checked + .box svg { opacity:1; transform:scale(1); }
  .check input:focus-visible + .box { box-shadow:0 0 0 4px rgba(79,140,255,.25); }

  button.submit {
    position:relative; width:100%; height:50px; border:0; border-radius:12px; cursor:pointer; color:#fff;
    font-size:1rem; font-weight:650; letter-spacing:.01em;
    background:linear-gradient(135deg,var(--acc),var(--acc2)); box-shadow:0 10px 22px rgba(79,140,255,.32);
    transition:transform .12s, box-shadow .12s, filter .12s;
  }
  button.submit:hover:not(:disabled) { filter:brightness(1.07); box-shadow:0 12px 26px rgba(79,140,255,.42); }
  button.submit:active:not(:disabled) { transform:translateY(1px); }
  button.submit:focus-visible { outline:3px solid rgba(79,140,255,.45); outline-offset:2px; }
  button.submit:disabled { cursor:not-allowed; filter:saturate(.55) brightness(.9); box-shadow:none; }
  button.submit .spin { display:none; width:20px; height:20px; border-radius:50%; margin:auto;
    border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite; }
  button.submit.loading .txt { display:none; } button.submit.loading .spin { display:block; }

  .foot { margin:22px 0 0; text-align:center; font-size:.78rem; color:var(--mut); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.985); } to { opacity:1; transform:none; } }
  @keyframes shake { 20%,60% { transform:translateX(-7px); } 40%,80% { transform:translateX(7px); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .card, .shake, button.submit .spin { animation:none; } }
  @media (max-width:440px) { .card { padding:30px 22px 24px; border-radius:18px; } }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88"/><path d="M14.47 14.48 20 20"/><path d="M8.12 8.12 12 12"/></svg>
    </div>
    <h1>Video Clipper</h1>
    <p class="sub">Masuk untuk mulai memotong video</p>
  </div>

  {% if error %}
  <div class="banner err shake" role="alert" id="msg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
    <span id="msgText">{{ error }}</span>
  </div>
  {% elif bye %}
  <div class="banner ok" role="status" id="msg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <span>Anda sudah keluar. Sampai jumpa lagi!</span>
  </div>
  {% endif %}

  <form method="post" action="{{ url_for('login') }}" id="form" autocomplete="on" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">

    <div class="field">
      <label class="lbl" for="username">Nama pengguna</label>
      <div class="control{{ ' invalid' if error and not retry_after }}" id="cu">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="username" name="username" type="text" value="{{ username }}" placeholder="Masukkan nama pengguna"
               autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required {{ '' if username else 'autofocus' }}>
      </div>
    </div>

    <div class="field">
      <label class="lbl" for="password">Kata sandi</label>
      <div class="control{{ ' invalid' if error and not retry_after }}" id="cp">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" name="password" type="password" placeholder="Masukkan kata sandi"
               autocomplete="current-password" required {{ 'autofocus' if username else '' }}>
        <button type="button" class="eye" id="eye" aria-pressed="false" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg>
        </button>
      </div>
      <p class="hint" id="caps" role="status">Caps Lock sedang aktif</p>
    </div>

    <div class="row">
      <label class="check">
        <input type="checkbox" name="remember" value="1" id="remember">
        <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
        Ingat saya selama 14 hari
      </label>
    </div>

    <button type="submit" class="submit" id="btn" data-retry="{{ retry_after or 0 }}">
      <span class="txt" id="btnTxt">Masuk</span><span class="spin" aria-hidden="true"></span>
    </button>
  </form>
  <p class="foot">Lupa kata sandi? Hubungi pemilik server.</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), btn = $('btn'), pw = $('password'), user = $('username');

  // tampilkan / sembunyikan kata sandi
  $('eye').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.setAttribute('aria-pressed', show ? 'true' : 'false');
    this.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
    this.title = this.getAttribute('aria-label');
    pw.focus();
  });

  // peringatan Caps Lock (inline, bukan popup)
  function caps(e) {
    if (!e.getModifierState) return;
    $('caps').classList.toggle('show', e.getModifierState('CapsLock'));
  }
  pw.addEventListener('keydown', caps); pw.addEventListener('keyup', caps);
  pw.addEventListener('blur', function () { $('caps').classList.remove('show'); });

  // hapus tanda error saat pengguna mengetik lagi
  [user, pw].forEach(function (el) {
    el.addEventListener('input', function () {
      $('cu').classList.remove('invalid'); $('cp').classList.remove('invalid');
    });
  });

  // status memuat saat kirim; validasi kosong ditampilkan inline
  form.addEventListener('submit', function (e) {
    if (!user.value.trim() || !pw.value) {
      e.preventDefault();
      showError(!user.value.trim() ? 'Nama pengguna wajib diisi.' : 'Kata sandi wajib diisi.');
      (!user.value.trim() ? user : pw).focus();
      return;
    }
    btn.classList.add('loading'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  });
  window.addEventListener('pageshow', function () {  // tombol Kembali: pulihkan tombol
    btn.classList.remove('loading'); if (!remaining) btn.disabled = false; btn.removeAttribute('aria-busy');
  });

  function showError(text) {
    var box = $('msg');
    if (!box || !box.classList.contains('err')) {
      box = document.createElement('div');
      box.id = 'msg'; box.className = 'banner err'; box.setAttribute('role', 'alert');
      box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span id="msgText"></span>';
      var old = $('msg'); if (old) old.remove();
      form.parentNode.insertBefore(box, form);
    }
    $('msgText').textContent = text;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  }

  // hitung mundur saat akun dikunci sementara
  var remaining = parseInt(btn.getAttribute('data-retry'), 10) || 0;
  if (remaining > 0) {
    btn.disabled = true;
    var label = $('btnTxt'), base = 'Masuk';
    (function tick() {
      if (remaining <= 0) {
        btn.disabled = false; label.textContent = base;
        var t = $('msgText'); if (t) t.textContent = 'Silakan coba masuk lagi.';
        return;
      }
      label.textContent = 'Coba lagi dalam ' + remaining + ' dtk';
      var t2 = $('msgText'); if (t2) t2.textContent = 'Terlalu banyak percobaan gagal. Coba lagi dalam ' + remaining + ' detik.';
      remaining -= 1; setTimeout(tick, 1000);
    })();
  }
})();
</script>
</body>
</html>
